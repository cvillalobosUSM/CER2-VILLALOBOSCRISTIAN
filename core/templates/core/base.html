{% load static %}
<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap"
            rel="stylesheet"
        />

        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css"
        />

        <link rel="stylesheet" href="{% static 'core/css/style.css' %}" />

        <title>{% block titulo %}Huellas del Puerto{% endblock %}</title>
    </head>

    <body>
        <!-- HEADER Y NAVEGACIÓN -->
        <header>
            <nav class="navegacion navbar navbar-expand-lg">
                <div class="container">
                    <a class="navbar-brand" href="/">
                        <img
                            src="{% static 'core/img/logo.png' %}"
                            alt="Huellas del Puerto"
                            class="logo-header"
                        />
                    </a>

                    <button
                        class="navbar-toggler"
                        type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#navbarNav"
                        aria-controls="navbarNav"
                        aria-expanded="false"
                        aria-label="Abrir menú de navegación"
                    >
                        <span class="navbar-toggler-icon"></span>
                    </button>

                    <div class="collapse navbar-collapse" id="navbarNav">
                        <ul class="navbar-nav ms-auto">
                            <li class="nav-item">
                                <a class="nav-link" href="/">Inicio</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="/mascotas/"
                                    >Mascotas</a
                                >
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="/adopcion/"
                                    >Adopción</a
                                >
                            </li>
                        </ul>
                    </div>
                </div>
            </nav>
        </header>

        <!-- CONTENIDO -->
        <main>{% block contenido %} {% endblock %}</main>

        <!-- FOOTER -->
        <footer class="footer">
            <div class="container padtopbottom">
                <div class="row align-items-center">
                    <div class="col-12 col-md-6">
                        <img
                            src="{% static 'core/img/logo.png' %}"
                            alt="Huellas del Puerto"
                            class="logo-footer"
                        />
                    </div>

                    <div class="col-12 col-md-6 text-md-end">
                        <a href="#" aria-label="Instagram">
                            <i class="bi bi-instagram"></i>
                        </a>
                        <a href="#" class="ms-2" aria-label="Facebook">
                            <i class="bi bi-facebook"></i>
                        </a>
                        <a href="#" class="ms-2" aria-label="WhatsApp">
                            <i class="bi bi-whatsapp"></i>
                        </a>
                    </div>
                </div>
            </div>
        </footer>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
