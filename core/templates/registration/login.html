{% extends 'core/base.html' %}

{% load static %}

{% block titulo %}
    RH | Iniciar sesión
{% endblock %}

{% block contenido %}

<section class="login">
    <div class="container d-flex justify-content-center align-items-center py-5">
        <div class="card shadow-lg border-0 login-card login-tarjeta">
            <div class="card-body p-4 p-md-5">
                <div class="text-center mb-4">
                    <img
                        src="{% static 'core/img/favicon.png' %}"
                        alt="Refugio Huellitas"
                        class="logo-header"
                    />
                    <h1><strong>¡Bienvenido!</strong></h1>
                </div>

                <form method="POST">
                    {% csrf_token %}
                    {% if form.errors %}
                        <div class="alert alert-danger" role="alert">
                            Usuario o contraseña incorrectos. Inténtalo nuevamente.
                        </div>
                    {% endif %}

                    <div class="mb-3">
                        <label for="{{ form.username.id_for_label }}"class="form-label">Usuario</label>
                        <input type="text"
                               name="{{ form.username.html_name }}"
                               id="{{ form.username.id_for_label }}"
                               class="form-control form-control-lg"
                               placeholder="Ingresa tu usuario"
                               autocomplete="username"
                               required>
                    </div>

                    <div class="mb-4">
                        <label for="{{ form.password.id_for_label }}"class="form-label">Contraseña</label>

                        <input type="password"
                               name="{{ form.password.html_name }}"
                               id="{{ form.password.id_for_label }}"
                               class="form-control form-control-lg"
                               placeholder="Ingresa tu contraseña"
                               autocomplete="current-password"
                               required>
                    </div>

                    <button type="submit" class="btn btn-primary btn-lg w-100">
                        Iniciar sesión
                    </button>

                </form>

                <div class="text-center mt-4">
                    <a href="/" class="text-decoration-none">
                        Volver al inicio
                    </a>
                </div>
            </div>
        </div>
    </div>
</section>

{% endblock %}
